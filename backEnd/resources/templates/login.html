<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 朝歌夜弦的博客</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/login.css')}}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='ico/favicon.ico') }}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/footer.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/header.css')}}">
    <style>
        /* 复用博客主样式 */
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff5f5;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <video id="video-background" autoplay muted loop>
        <source src="{{url_for('static',filename='mp4/wallpaper.mp4')}}" type="video/mp4">
    </video>
    {% include "includes/header.html" %}

    <div class="login-container">
        <h2 style="text-align: center; color: #ff4500; margin-bottom: 30px;">欢迎登录</h2>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="4-16位字母/数字/下划线"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="6-18位字母+数字组合"
                    required
                >
            </div>

            <button type="submit" class="login-btn">立即登录</button>
        </form>

        <div class="bottom-links">
            <a href="#">忘记密码？</a>
            <a href="#">注册账号</a>
        </div>
    </div>

    {% include "includes/footer.html" %}
    <script src="{{url_for('static',filename='js/login.js')}}"></script>
</body>
</html>
